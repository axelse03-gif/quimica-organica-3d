<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plataforma didáctica 3D de Química Orgánica y nomenclatura IUPAC" />
    <title>Química Orgánica 3D</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='20' r='5' fill='%2314b8a6'/%3E%3Ccircle cx='22' cy='11' r='5' fill='%236366f1'/%3E%3Cpath d='M12 17l7-4' stroke='%2394a3b8' stroke-width='2'/%3E%3C/svg%3E" />
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo
      try {
        var t = localStorage.getItem('qo3d-theme')
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
